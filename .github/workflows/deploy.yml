name: CI / Deploy to Vercel

on:
  push:
    branches:
      - master

jobs:
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx next lint --max-warnings 0

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
