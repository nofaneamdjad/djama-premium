# Nginx config — editor.djama.space → Collabora Online
# Géré par docker-compose.yml dans infra/

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    server_name editor.djama.space;

    # Let's Encrypt renewal challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS + proxy vers Collabora ──────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name editor.djama.space;

    # Certificat Let's Encrypt (généré par certbot)
    ssl_certificate     /etc/letsencrypt/live/editor.djama.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/editor.djama.space/privkey.pem;

    # Protocoles et chiffrement recommandés (Mozilla Intermediate)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS (6 mois)
    add_header Strict-Transport-Security "max-age=15768000" always;

    # Headers sécurité
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Taille max upload (documents bureautiques)
    client_max_body_size 60M;

    # ── WebSocket (requis par Collabora) ─────────────────────────────────────
    location ^~ /cool/ {
        proxy_pass         http://collabora:9980;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API REST Collabora (WOPI, admin) ──────────────────────────────────────
    location ^~ /hosting/ {
        proxy_pass         http://collabora:9980;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── Assets Collabora (JS, CSS, icônes) ───────────────────────────────────
    location ^~ /browser/ {
        proxy_pass         http://collabora:9980;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Cache agressif pour les assets statiques
        proxy_cache_valid  200 1d;
        add_header         Cache-Control "public, max-age=86400";
    }

    # ── Racine (health check) ─────────────────────────────────────────────────
    location / {
        proxy_pass         http://collabora:9980;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
